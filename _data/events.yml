- title: "Alchemical Influences in William Blake"
  date: 2026-07-21
  recurs: Every Tuesday and Thursday, beginning Tuesday, July 21, 2026
  time: "7:00–8:30 pm"
  location: Hermeticus Bookshop, 469 B Street, Ashland, Oregon 97520
  cost: By donation · Scholarships available
  description: >-
    A brief history of alchemy for William Blake. This class covers those
    alchemists important to the development of Blake's world-view, and
    influential to differing degrees in his artistic, visionary, and poetic
    output. An ongoing class meeting every Tuesday and Thursday evening,
    beginning Tuesday, July 21, 2026, offered by donation to support Allen's
    study,
    preparation, and eagerness to share his love of Blake; scholarships are
    available for qualifying students. Newcomers are welcome at any session.
- title: "POETICON II — Creative Arts Mash-Up"
  date: 2026-07-31
  time: "5:00 pm at Hermeticus"
  location: Hermeticus Bookshop, 469 B Street, Ashland, Oregon &amp; Beat Farm Co-op, 38 Lithia Way, Ashland, Oregon
  cost: Free admission
  image: /assets/images/poeticon-ii.jpg
  image_alt: >-
    POETICON II poster — a one-day Creative Arts Mash-Up on Friday, July 31, in
    Ashland, Oregon, with a stylized golden portrait of William Blake behind bold
    black lettering and small photographs of the featured artists.
  description: >-
    A one-day Creative Arts Mash-Up across two Ashland venues, presented with the
    William Blake Institute. The afternoon opens at Hermeticus Bookshop from 5:00
    to 8:00 pm — music at 5:00, open mic at 5:30, featured poets Michael Mollo,
    Kate Beles, and Allen Ensign, musical guest Casey Gina, and visual artist
    Zoriya Blalöck. The evening continues at Beat Farm Co-op (38 Lithia Way) with
    doors at 7:30 and the program running 8:00 pm until late: sips and eats from
    Ola Loa General Store, an 8:00 open mic, featured poets Megan Lebov and Ian
    &lsquo;White Tiger&rsquo; Stetson, musical guests &lsquo;Mustard Man&rsquo;
    Dylan and DJ Room Service, and visual artists Karen Hanken and Jared
    Lombardo.
