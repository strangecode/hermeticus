# Single source of truth for the Events page.
# Events can go in any order; the page sorts by `date`.
# Each item:
#   title:       required. Event name.
#   date:        required. ISO 8601 (YYYY-MM-DD); the page formats it for display.
#   time:        optional. Human-readable start time, e.g. "7:00 pm".
#   location:    optional. Venue and address, shown as one line.
#   cost:        optional. e.g. "Free admission".
#   description: optional. One short paragraph.
#   image:       optional. Path under /assets/images/…; rendered as a photo when present.
#   image_alt:   optional but required when `image` is set. Describes the photo.
#   recurs:      optional. Human-readable recurrence, e.g. "Every Tuesday and
#                Thursday". When set, the event is treated as an ongoing series:
#                it always shows under Upcoming and never ages into Past. Use
#                `date` as the series start (it anchors sort order). Shown in
#                place of a single calendar date.
- title: Open Mike Poetry Reading
  date: 2026-07-17
  time: "7:00 pm"
  location: Hermeticus Bookshop, 469 B Street, Ashland, Oregon
  cost: Free admission
  description: >-
    Come all poets and lovers of poetry! Come to share or simply to listen —
    all are welcome.
  image: /assets/images/open-mike-poetry-reading.jpg
  image_alt: >-
    Poets and listeners gathered in a circle for a reading inside Hermeticus
    Bookshop, the shop's front window and book-lined shelves behind them.
- title: "Alchemical Influences in William Blake"
  date: 2026-07-21
  recurs: Every Tuesday and Thursday, beginning Tuesday, July 21, 2026
  time: "7:00–8:30 pm"
  location: Hermeticus Bookshop, 469 B Street, Ashland, Oregon 97520
  cost: By donation · Scholarships available
  description: >-
    A brief history of alchemy for William Blake. This class covers those
    alchemists important to the development of Blake's world-view, and
    influential to differing degrees in his artistic, visionary, and poetic
    output. An ongoing class meeting every Tuesday and Thursday evening,
    beginning Tuesday, July 21, 2026, offered by donation to support Allen's
    study,
    preparation, and eagerness to share his love of Blake; scholarships are
    available for qualifying students. Newcomers are welcome at any session.
