# Single source of truth for the Events page.
# Events can go in any order; the page sorts by `date`.
# Each item:
#   title:       required. Event name.
#   date:        required. ISO 8601 (YYYY-MM-DD); the page formats it for display.
#   time:        optional. Human-readable start time, e.g. "7:00 pm".
#   location:    optional. Venue and address, shown as one line.
#   cost:        optional. e.g. "Free admission".
#   description: optional. One short paragraph.
#   image:       optional. Path under /assets/images/…; rendered as a photo when present.
#   image_alt:   optional but required when `image` is set. Describes the photo.
- title: Open Mike Poetry Reading
  date: 2026-07-17
  time: "7:00 pm"
  location: Hermeticus Bookshop, 469 B Street, Ashland, Oregon
  cost: Free admission
  description: >-
    Come all poets and lovers of poetry! Come to share or simply to listen —
    all are welcome.
  # Add the photo file to assets/images/ then uncomment the two lines below.
  # image: /assets/images/open-mike-poetry-reading.jpg
  # image_alt: >-
  #   Poets and listeners gathered in a circle for a reading inside Hermeticus
  #   Bookshop, the shop's front window and book-lined shelves behind them.
